[project]
name = "django-ninja-template"
version = "0.1.0"
description = "Async django-ninja API template: layered domain/web split, OTP + JWT auth, ULID keys"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "django>=6.0.4",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.5.3",
    "django-templated-email>=3.1.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "phonenumbers>=9.0.0",
    "psycopg>=3.3.2",
    "psycopg-binary>=3.3.2",
    "pyjwt>=2.10.1",
    "uvicorn>=0.40.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "faker>=40.1.2",
    "ruff>=0.14.13",
]
